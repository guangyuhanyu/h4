const $=s=>document.querySelector(s);
function showForm(t){$('#wait').style.display='none';$('#form').style.display='';if(t)$('#why').innerHTML=t}
async function openPage(){try{const h=await GY.decryptPage(UNIT,ENC);document.open();document.write(h);document.close();return true}catch(e){return false}}
async function init(){
 if(!window.GY){showForm('Không tải được hệ thống mã. Bạn mở bài qua trang chủ của Thầy nhé.');return}
 if(GY.key(UNIT)&&await openPage())return;
 if(GY.rawSession()){await GY.refresh();if(GY.key(UNIT)&&await openPage())return;
  const s=GY.session();if(s){showForm('Xin chào <b>'+(s.name||'bạn')+'</b>, mã của bạn <b>chưa được mở bài này</b>. Bạn liên hệ Thầy để mở thêm nhé, hoặc nhập mã khác.');return}
  const r=GY.rawSession();if(r&&r.exp&&new Date(r.exp)<new Date()){showForm('<b style="color:#B83A4B">Mã của bạn đã hết hạn.</b> Bạn liên hệ Thầy để gia hạn nhé.');return}}
 showForm()}
async function go(){const b=$('#go');b.disabled=true;b.textContent='Đang kiểm tra…';$('#msg').textContent='';
 const r=await GY.login($('#code').value);b.disabled=false;b.textContent='Mở bài';
 if(!r.ok){$('#msg').textContent=GY.ERR[r.error]||'Có lỗi, bạn thử lại sau nhé.';return}
 if(GY.key(UNIT)){if(!(await openPage()))$('#msg').textContent='Không mở được bài, bạn tải lại trang nhé.';return}
 $('#msg').textContent='Mã đúng, nhưng chưa được mở bài này. Bạn liên hệ Thầy nhé.'}
$('#go').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()};
init();
})();
</script></body></html>
