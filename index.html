<style>
:root{
  --paper:#F7F4ED; --paper-2:#EFE9E1; --card:#FFFDF9;
  --rose:#A85A75; --rose-d:#8E4E63; --rose-soft:#FCEEF2; --rose-line:#EDC3CF; --acc:#C8507A;
  --seal:#B83A4B; --ink:#4A2A35; --gray:#9A8790; --line:#EADCD8; --ok:#3E8E5A;
  /* Quyển 上 (nhạt) · Quyển 下 (đậm) */
  --up-bg:#FFF6F8; --up-ring:#F0C4D1; --up-num:#B86A84;
  --dn-bg:linear-gradient(150deg,#C66F8C,#9C4E68); --dn-ring:#8E4E63; --dn-num:#FFF3F6; --dn-card:#FBF0F3;
  --f-disp:'Baloo 2',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-han:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-title:'Noto Serif SC','Songti SC','SimSun',serif;
  --f-latin:'Cormorant Garamond',Georgia,serif;
  --shadow:0 10px 30px rgba(110,50,70,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(900px 500px at 100% -5%,#F6E4E9 0%,transparent 60%),radial-gradient(700px 420px at -10% 30%,#F1ECE2 0%,transparent 60%);
  padding:20px 16px 60px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{max-width:1080px;margin:0 auto}

/* ===== Banner (lấy từ file bài tập) ===== */
.ban{--rose:#9C5A6E;--qh:#A85A75;--az:#E3A9BB;--mute:#A68A94;--ink2:#7A5262;--line:#EAD2D6;--serif:"Noto Serif SC","Songti SC",serif;--brush:"Ma Shan Zheng","Kaiti SC","STKaiti",serif;--latin:"Cormorant Garamond",Georgia,serif;flex:none;position:relative;overflow:hidden;isolation:isolate;border-radius:22px;padding:22px 32px 20px;background:linear-gradient(115deg,#FFFDF9 0%,#FDF6F8 50%,#F9E6EC 100%);border:1px solid var(--line);box-shadow:0 10px 26px rgba(156,90,110,.12)}
.ban::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(168,90,117,.42);border-radius:15px;pointer-events:none}
.ban::after{content:"";position:absolute;inset:13px;border:1px solid rgba(200,80,122,.22);border-radius:11px;pointer-events:none}
.bart{position:absolute;right:1.5%;top:-4%;width:31%;aspect-ratio:915/866;transform:scaleX(-1);z-index:-1;pointer-events:none}
.bart .br{position:absolute;inset:0;background:center/100% 100% no-repeat}
.bart .ln{position:absolute;background-size:100% 100%;background-repeat:no-repeat;animation:lsw 5s ease-in-out infinite}
@keyframes lsw{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.bland{position:absolute;right:25%;bottom:-6%;width:22%;height:70%;background:center bottom/contain no-repeat;opacity:.18;z-index:-2;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px}
.brand i{width:50px;height:50px;background:center/contain no-repeat;flex:none}
.brand b{display:block;font-family:var(--latin);font-style:italic;font-size:25px;font-weight:600;color:var(--rose);line-height:1}
.brand small{display:block;font-size:13px;color:var(--mute);margin-top:4px;text-align:left}
.k{display:flex;align-items:center;gap:16px;margin-top:12px;max-width:64%}
.ring{position:relative;flex:none;width:72px;height:72px;display:grid;place-items:center}
.ring i{position:absolute;inset:0;background:center/contain no-repeat}
.ring b{position:relative;font-family:var(--brush);font-weight:400;font-size:30px;color:var(--rose);padding-top:3px}
.ring.n2 b{font-size:22px;letter-spacing:-.02em}
.ban h1{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.25;color:var(--acc);letter-spacing:.02em}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tags span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #EBCBD5;color:var(--rose);border-radius:99px;padding:3px 14px;font-size:14px;font-weight:600}
.tags b{font-family:var(--brush);font-weight:400;font-size:18px;color:var(--acc)}
.tl{margin-top:10px;font-size:14px;color:var(--mute);max-width:50%;line-height:1.6}
.tl b{color:var(--qh)}
.stamp{position:absolute;right:35%;top:30px;transform:rotate(-12deg);border:2.5px double var(--seal);color:var(--seal);opacity:.15;border-radius:8px;padding:3px 10px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bart .ln{animation:none}}

.ban .tl{max-width:56%;margin-top:14px}
.ban .tl .zalo{margin-left:8px;vertical-align:middle}
.ban .zalo{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #EBCBD5;color:var(--qh);text-decoration:none;font-weight:700;border-radius:99px;padding:3px 13px 3px 9px;font-size:14px;box-shadow:0 4px 12px rgba(156,90,110,.08)}
.ban .zalo svg{fill:var(--acc)}.ban .zalo:hover{background:#FCEEF2}
.ban .tl .slogan{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--qh)}
@media (max-width:760px){
 .ban{padding:20px 18px 18px;border-radius:18px}.ban::before{inset:6px;border-radius:13px}.ban::after{inset:10px;border-radius:10px}
 .bart{width:40%;right:-3%;top:-2%}.bland{display:none}.stamp{display:none}
 .brand{padding-right:36%}.brand i{width:42px;height:42px}.brand b{font-size:21px}.brand small{font-size:12px}
 .k{max-width:none;padding-right:34%;gap:10px;margin-top:14px}.ring{width:56px;height:56px}.ring b{font-size:24px}
 .ban h1{font-size:30px}.ban .tl{max-width:none;font-size:13.5px}.tags{margin-top:12px}.tags span{padding:2px 10px;font-size:13px}
 .ban .tl .slogan{font-size:15px;display:block}.ban .tl .zalo{margin:8px 0 0}
}

/* ===== Thanh mã học viên ===== */
.member{margin-top:16px;background:var(--card);border:1.5px solid var(--rose-line);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(110,50,70,.06);font-size:15.5px}
.member:empty{display:none}
.member .m-lock,.member .m-ok{font-size:22px}
.member .m-txt{flex:1 1 280px}
.m-form{display:flex;gap:8px;flex:1 1 260px;min-width:0;max-width:100%}
.m-form input{flex:1;min-width:0;font:inherit;font-size:17px;letter-spacing:.08em;padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.m-form input:focus{outline:none;border-color:var(--rose);background:#fff;box-shadow:0 0 0 4px var(--rose-soft)}
.m-form button{border:0;border-radius:12px;background:var(--rose-d);color:#FFF3F6;font-weight:700;font-size:16px;padding:0 18px;white-space:nowrap}
.m-form button[disabled]{opacity:.6}
.m-link{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;color:var(--rose-d);font-weight:700;font-size:14px}
.m-msg{flex-basis:100%;color:var(--seal);font-weight:600;font-size:14.5px}
.m-msg:empty{display:none}

/* ===== Bố cục ===== */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.sidebar{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px}
.cat-btn{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;text-align:left;box-shadow:0 4px 14px rgba(110,50,70,.06);transition:.15s;width:100%}
.cat-btn:hover{border-color:var(--rose-line);transform:translateY(-1px)}
.cat-btn.active{border-color:var(--rose);background:#fff;box-shadow:0 0 0 4px var(--rose-soft),var(--shadow)}
.cat-ico{flex:none;position:relative;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px var(--rose-line),0 0 0 3px #fff,0 0 0 4.5px var(--rose-line)}
.cat-ico img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:contain}
.cat-ico b{position:absolute;right:-5px;bottom:-4px;min-width:22px;height:22px;border-radius:50%;background:var(--seal);color:#FFF3F6;font-family:var(--f-latin);font-style:italic;font-weight:700;font-size:15px;line-height:22px;text-align:center;padding-right:1px;box-shadow:0 0 0 2px #fff}
.cat-txt{flex:1;min-width:0}
.cat-txt b{display:block;font-family:var(--f-disp);font-size:19px;line-height:1.2;color:var(--ink)}
.cat-txt small{display:block;font-size:13.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-n{flex:none;font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--rose-d);background:var(--rose-soft);border-radius:99px;min-width:34px;text-align:center;padding:2px 10px}

.main{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 22px 26px;min-height:420px}
.back-btn{display:none;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--rose-d);border-radius:99px;padding:8px 16px 8px 10px;font-weight:700;font-size:15px;margin-bottom:14px}
.back-btn svg{width:18px;height:18px}
.list-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.list-head .cat-ico{width:62px;height:62px}
.list-head h2{margin:0;font-family:var(--f-disp);font-size:26px;line-height:1.15}
.list-head h2 small{display:block;font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--gray)}
.search{position:relative;margin-top:16px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--rose)}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 16px 13px 46px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--rose);background:#fff;box-shadow:0 0 0 4px var(--rose-soft)}

/* nút chọn quyển */
.books{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.books button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-weight:600;font-size:15px;color:var(--rose-d);display:inline-flex;align-items:center;gap:8px}
.books button .dot{width:12px;height:12px;border-radius:50%}
.books button .dot.up{background:var(--up-bg);box-shadow:inset 0 0 0 2px var(--up-ring)}
.books button .dot.dn{background:var(--dn-bg)}
.books button.on{border-color:var(--rose);background:var(--rose-soft)}
.books button .zh{font-family:var(--f-title);font-weight:900}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.sub-h{grid-column:1/-1;margin:8px 0 -4px;font-weight:700;color:var(--rose-d);font-size:15px;display:flex;align-items:center;gap:10px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sub-h .bk{font-family:var(--f-title);font-weight:900;font-size:15px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;transform:rotate(-6deg)}
.sub-h .bk.up{background:var(--up-bg);color:var(--up-num);box-shadow:inset 0 0 0 1.5px var(--up-ring)}
.sub-h .bk.dn{background:var(--dn-bg);color:var(--dn-num)}

.card{display:flex;align-items:center;gap:14px;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;transition:.15s;position:relative}
.card:hover{border-color:var(--rose);transform:translateY(-2px);box-shadow:0 10px 22px rgba(110,50,70,.14)}
.num{flex:none;width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;line-height:1;
  background:var(--up-bg);box-shadow:inset 0 0 0 2px var(--up-ring)}
.num b{font-family:var(--f-latin);font-style:italic;font-weight:700;font-size:27px;line-height:.9;color:var(--up-num);padding-right:.08em}
.num small{font-family:var(--f-han);font-size:9.5px;line-height:1;color:var(--gray);font-weight:500}
.num .zh{font-family:var(--f-title);font-style:normal;font-size:22px;padding:0}
.card:hover .num{box-shadow:inset 0 0 0 2px var(--rose)}
/* Quyển 下: tông đậm */
.card.dn{background:var(--dn-card);border-color:#E8CCD5}
.card.dn .num{background:var(--dn-bg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.card.dn .num b{color:var(--dn-num)}
.card.dn .num small{color:#F6D7E0}
.card.dn:hover .num{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--rose-d)}
.card-body{flex:1;min-width:0}
.card-v{font-weight:700;font-size:15px;color:var(--rose-d)}
.card-t{display:block;font-family:var(--f-han);font-size:21px;font-weight:500;line-height:1.3;color:var(--ink)}

function renderMember(){
  const el=$('#member');if(!HAS_GY){el.innerHTML='';return}
  const s=GY.session(),raw=GY.rawSession();
  if(s){el.innerHTML=`<span class="m-ok">🔓</span><span class="m-txt">Xin chào <b>${s.name||'bạn'}</b> · đã mở <b>${(s.lessons||[]).length}</b>/${N} bài · hạn dùng đến <b>${GY.fmtDate(s.exp)}</b></span><button type="button" id="mOut" class="m-link">Đổi mã</button>`;
    $('#mOut').onclick=()=>{GY.logout();unlockLinks().then(()=>{renderMember();renderAll()})};return}
  el.innerHTML=`<span class="m-lock">🔒</span><span class="m-txt">${raw&&new Date(raw.exp)<new Date()?'<b style="color:var(--seal)">Mã đã hết hạn.</b> ':''}Bài 1 học thử miễn phí. Nhập <b>mã học viên</b> để mở các bài khác:</span>
   <span class="m-form"><input id="mCode" placeholder="XXXXXXXX" inputmode="numeric" autocomplete="off" spellcheck="false"><button type="button" id="mGo">Mở khóa</button></span><span class="m-msg" id="mMsg"></span>`;
  const go=async()=>{const b=$('#mGo');b.disabled=true;b.textContent='Đang kiểm tra…';const r=await GY.login($('#mCode').value);b.disabled=false;b.textContent='Mở khóa';
    if(!r.ok){$('#mMsg').textContent=GY.ERR[r.error]||'Có lỗi, thử lại sau.';return}await unlockLinks();renderMember();renderAll()};
  $('#mGo').onclick=go;$('#mCode').onkeydown=e=>{if(e.key==='Enter')go()};
}

 document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.id;state.view='list';state.search='';state.book='all';$('#searchInput').value='';renderAll();if(innerWidth<=760)scrollTo({top:0})}));
}

function renderBooks(){
 const has=LESSONS.some(l=>l.category===state.category&&l.book);
 if(!has){$('#books').innerHTML='';return}
 const b=[['all','Tất cả',''],['up','<span class="zh">上</span> Bài 1–10','up'],['dn','<span class="zh">下</span> Bài 11–20','dn']];
 $('#books').innerHTML=b.map(([k,t,d])=>`<button type="button" data-b="${k}" class="${state.book===k?'on':''}">${d?`<i class="dot ${d}"></i>`:''}${t}</button>`).join('');
 document.querySelectorAll('#books button').forEach(x=>x.onclick=()=>{state.book=x.dataset.b;renderBooks();renderResults()});
}
function renderResults(){
 const q=state.search.trim().toLowerCase();
 const items=LESSONS.filter(l=>l.category===state.category&&(state.book==='all'||!l.book||l.book===state.book)&&(!q||(l.titleVi+' '+l.hanzi+' '+l.desc+' 第'+cn(l.n||0)+'课').toLowerCase().includes(q)));
 if(!items.length){$('#results').innerHTML='<div class="empty"><div class="h">尚无课件</div>Thầy sẽ cập nhật sớm, quay lại sau nhé.</div>';return}
 let last='';
 $('#results').innerHTML='<div class="grid">'+items.map(l=>{
  const u=UNIT_OF(l),soon=!!l.soon,locked=!soon&&!!(u&&!GY.key(u));const ext=/^https?:/.test(l.href)||!!l.enc;
  const g=l.group||(l.book?l.book:'');let head='';
  if(g&&g!==last){last=g;head=l.book?`<div class="sub-h"><span class="bk ${l.book}">${l.book==='up'?'上':'下'}</span>${BOOKNAME[l.book]}</div>`:`<div class="sub-h">${g}</div>`}
  const dn=l.book==='dn'||l.dark;
  const num=l.n?`<b>${l.n}</b><small>第${cn(l.n)}课</small>`:`<b class="zh">${l.ico||'复'}</b>`;
  return head+`<a class="card ${dn?'dn':''} ${locked?'locked':''} ${soon?'soon':''}" href="${locked||soon||!l.href?'#':l.href}" ${soon?'data-soon="1"':''} ${locked?'data-locked="1"':''} ${ext&&!locked&&!soon?'target="_blank" rel="noopener"':''}>
   <span class="num">${num}</span><span class="card-body"><span class="card-v">${l.titleVi}${ext?'<span class="tag">Drive</span>':''}${soon?'<span class="tag soon">Sắp ra mắt</span>':''}</span>
   ${l.hanzi?`<span class="card-t">${l.hanzi}</span>`:''}<span class="card-d">${l.desc}</span></span>
   <span class="arrow">${soon?CLOCK:locked?LOCK:ARROW}</span></a>`}).join('')+'</div>';
 document.querySelectorAll('.card[data-locked]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();lockedMsg()}));
 document.querySelectorAll('.card[data-soon]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast('⏳ Bài này sắp ra mắt, Thầy đang hoàn thiện — Anh/chị quay lại sau nhé!')}));
}
function renderAll(){renderSidebar();renderHead();renderBooks();renderResults();app.classList.toggle('view-list',state.view==='list')}
$('#backBtn').addEventListener('click',()=>{state.view='menu';app.classList.remove('view-list');scrollTo({top:0})});
$('#searchInput').addEventListener('input',e=>{state.search=e.target.value;renderResults()});
renderMember();renderAll();
if(HAS_GY){
 const syncNow=async()=>{if(GY.rawSession()){await GY.refresh(false);}await unlockLinks();renderMember();renderAll()};
 syncNow();
 window.addEventListener('pageshow',e=>{if(e.persisted)syncNow()});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
}
</script></body></html>
